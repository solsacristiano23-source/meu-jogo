      - name: Ofuscar codigo
        if: ${{ inputs.protect }}
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/obf" javascript-obfuscator@4.1.1
          cat > "$RUNNER_TEMP/obf.js" <<'EOT'
          const fs = require('fs');
          const JO = require(process.env.RUNNER_TEMP + '/obf/node_modules/javascript-obfuscator');
          const file = 'proj/app/src/main/assets/index.html';
          let html = fs.readFileSync(file, 'utf8');
          let ok = 0, fail = 0;
          html = html.replace(/<script(?![^>]*\bsrc\s*=)([^>]*)>([\s\S]*?)<\/script>/gi, (m, attrs, code) => {
            if (!code.trim() || /type\s*=\s*["'](?!text\/javascript)/i.test(attrs)) return m;
            try {
              const r = JO.obfuscate(code, { compact: true, target: 'browser', renameGlobals: false, stringArray: true, stringArrayThreshold: 0.75, identifierNamesGenerator: 'hexadecimal', controlFlowFlattening: false, deadCodeInjection: false, selfDefending: false, debugProtection: false, disableConsoleOutput: false });
              ok++;
              return '<script' + attrs + '>' + r.getObfuscatedCode() + '</script>';
            } catch (e) { fail++; console.log('aviso: um script nao foi ofuscado: ' + e.message); return m; }
          });
          fs.writeFileSync(file, html);
          console.log('scripts ofuscados:', ok, 'falhas:', fail);
          EOT
          node "$RUNNER_TEMP/obf.js"
      - name: Compilar APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon
      - name: Publicar APK na branch apks
        continue-on-error: true
        run: |
          set -e
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB"
          cp proj/app/build/outputs/apk/release/*.apk "$PUB/jogo.apk"
          echo "{\"run_id\":${{ github.run_id }},\"run_number\":${{ github.run_number }}}" > "$PUB/info.json"
          cd "$PUB"
          git init -q -b apks
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "apk ${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin apks
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-apk
          path: proj/app/build/outputs/apk/release/*.apk
