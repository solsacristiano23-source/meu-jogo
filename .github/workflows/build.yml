# motor v3
name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do jogo'
        required: true
        default: 'Meu Jogo'
      app_package:
        description: 'ID do app (minusculas, ex: com.taru.jogo1)'
        required: true
        default: 'com.taru.jogo1'
      orientation:
        description: 'Orientacao da tela'
        required: true
        default: 'landscape'
        type: choice
        options:
          - landscape
          - portrait
          - unspecified
      permissions:
        description: 'Recursos: internet, microfone, camera, localizacao, notificacoes, flutuante (separe por virgula)'
        required: false
        default: ''
      protect:
        description: 'Ofuscar o codigo (dificulta copia)'
        type: boolean
        default: false
      admob_app_id:
        description: 'AdMob: ID do app (ca-app-pub-...~...). Vazio = sem anuncios'
        required: false
        default: ''
      admob_banner:
        description: 'AdMob: ID do bloco Banner (opcional)'
        required: false
        default: ''
      admob_interstitial:
        description: 'AdMob: ID do bloco Intersticial (opcional)'
        required: false
        default: ''
      admob_rewarded:
        description: 'AdMob: ID do bloco Premiado (opcional)'
        required: false
        default: ''
      version_name:
        description: 'Versao do jogo'
        required: false
        default: '1.0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Chave de assinatura
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -storepass senha123 -keypass senha123 -alias key -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Jogos, O=Jogos"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore.jks
            git commit -m "chave de assinatura" || true
            git push || echo "AVISO: nao consegui salvar a chave no repositorio"
          fi
      - name: Montar projeto Android
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_PACKAGE: ${{ inputs.app_package }}
          ORI: ${{ inputs.orientation }}
          PERMS: ${{ inputs.permissions }}
          VERSION_NAME: ${{ inputs.version_name }}
          ADMOB_APP: ${{ inputs.admob_app_id }}
          ADMOB_BANNER: ${{ inputs.admob_banner }}
          ADMOB_INTER: ${{ inputs.admob_interstitial }}
          ADMOB_REWARD: ${{ inputs.admob_rewarded }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          test -f index.html || { echo "ERRO: falta o arquivo index.html na raiz do repositorio"; exit 1; }
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/com/taru/jogo
          cp index.html proj/app/src/main/assets/index.html
          cp keystore.jks proj/keystore.jks
          HAS_ICON=0
          for f in capa.png capa.jpg capa.jpeg capa.webp; do
            if [ -f "$f" ]; then CAPA="$f"; HAS_ICON=1; break; fi
          done
          if [ "$HAS_ICON" = 1 ]; then
            S=$(identify -format '%[fx:min(w,h)]' "$CAPA[0]")
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              mkdir -p proj/app/src/main/res/mipmap-${d%%:*}
              convert "$CAPA[0]" -gravity center -crop ${S}x${S}+0+0 +repage -resize ${d##*:}x${d##*:} PNG32:proj/app/src/main/res/mipmap-${d%%:*}/ic_launcher.png
            done
            mkdir -p proj/app/src/main/res/drawable-nodpi
            convert "$CAPA[0]" -gravity center -crop ${S}x${S}+0+0 +repage -resize 512x512 PNG32:proj/app/src/main/res/drawable-nodpi/capa.png
          fi
          export HAS_ICON
          cd proj
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jogo"
          include ":app"
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          printf 'org.gradle.jvmargs=-Xmx2g\nandroid.useAndroidX=true\n' > gradle.properties
          cat > app/src/main/assets/hook.js <<'EOT'
          (function(){
            if(window.__hookOk)return;window.__hookOk=true;
            function toData(url,cb){var x=new XMLHttpRequest();x.open('GET',url,true);x.responseType='blob';
              x.onload=function(){var r=new FileReader();r.onloadend=function(){cb(r.result);};r.readAsDataURL(x.response);};x.send();}
            function save(url,name){toData(url,function(d){AndroidBridge.saveBase64(d,name||'arquivo');});}
            var oc=HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click=function(){
              if(this.hasAttribute('download')&&/^(blob:|data:)/.test(this.href)){save(this.href,this.getAttribute('download'));return;}
              return oc.apply(this,arguments);};
            document.addEventListener('click',function(e){
              var a=e.target&&e.target.closest?e.target.closest('a[download]'):null;
              if(a&&/^(blob:|data:)/.test(a.href)){e.preventDefault();save(a.href,a.getAttribute('download'));}
            },true);
          })();
          EOT
          cat > app/src/main/java/com/taru/jogo/MainActivity.java <<'EOT'
          package com.taru.jogo;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              static MainActivity current;
              private static final int REQ_FILE = 11, REQ_PERM = 12, REQ_JS = 13, REQ_GEO = 14;
              private static final String HOST = "appassets.androidplatform.net";
              private WebView web;
              private FrameLayout root;
              private ImageView splash;
              private ValueCallback<Uri[]> fileCb;
              private PermissionRequest pendingPerm;
              private String pendingJsPerm, geoOrigin;
              private GeolocationPermissions.Callback geoCb;
              private long backAt = 0, startAt;
              private String hookJs = "";
              boolean keepRunning = false;

              static void callJs(final String code) {
                  final MainActivity m = current;
                  if (m != null && m.web != null) m.web.post(() -> m.web.evaluateJavascript(code, null));
              }

              static String[] permsFor(String name) {
                  switch (name) {
                      case "camera": return new String[]{Manifest.permission.CAMERA};
                      case "microfone": return new String[]{Manifest.permission.RECORD_AUDIO};
                      case "localizacao": return new String[]{Manifest.permission.ACCESS_FINE_LOCATION};
                      case "notificacoes": return Build.VERSION.SDK_INT >= 33 ? new String[]{"android.permission.POST_NOTIFICATIONS"} : new String[0];
                      default: return null;
                  }
              }

              boolean hasPermission(String name) {
                  String[] p = permsFor(name);
                  if (p == null) return false;
                  for (String s : p) if (checkSelfPermission(s) != PackageManager.PERMISSION_GRANTED) return false;
                  return true;
              }

              void askPermission(String rawName) {
                  final String name = rawName == null ? "" : rawName.replaceAll("[^a-z]", "");
                  runOnUiThread(() -> {
                      if (hasPermission(name)) { callJs("window.onPermissao&&window.onPermissao('" + name + "',true)"); return; }
                      String[] p = permsFor(name);
                      if (p == null) { callJs("window.onPermissao&&window.onPermissao('" + name + "',false)"); return; }
                      pendingJsPerm = name;
                      requestPermissions(p, REQ_JS);
                  });
              }

              void setKeepScreenOn(final boolean on) {
                  runOnUiThread(() -> {
                      if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  });
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  current = this;
                  startAt = System.currentTimeMillis();
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  try {
                      InputStream in = getAssets().open("hook.js");
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096]; int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                      hookJs = bo.toString("UTF-8");
                  } catch (Exception e) { }
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  web.setLongClickable(false);
                  web.setOnLongClickListener(v -> true);
                  web.setHapticFeedbackEnabled(false);
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.addJavascriptInterface(new Nativo(this), "Nativo");

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  web.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (HOST.equals(u.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                      @Override public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(hookJs, null);
                          hideSplash();
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(final PermissionRequest req) {
                          runOnUiThread(() -> {
                              List<String> missing = new ArrayList<>();
                              for (String r : req.getResources()) {
                                  String p = PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r) ? Manifest.permission.RECORD_AUDIO
                                      : PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) ? Manifest.permission.CAMERA : null;
                                  if (p != null && checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) missing.add(p);
                              }
                              if (missing.isEmpty()) { req.grant(req.getResources()); }
                              else { pendingPerm = req; requestPermissions(missing.toArray(new String[0]), REQ_PERM); }
                          });
                      }
                      @Override public void onGeolocationPermissionsShowPrompt(final String origin, final GeolocationPermissions.Callback cb) {
                          runOnUiThread(() -> {
                              if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) cb.invoke(origin, true, false);
                              else { geoOrigin = origin; geoCb = cb; requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, REQ_GEO); }
                          });
                      }
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), REQ_FILE); }
                          catch (Exception e) { fileCb = null; return false; }
                          return true;
                      }
                  });
                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      if (url.startsWith("blob:") || url.startsWith("data:")) {
                          String fn = URLUtil.guessFileName(url, cd, mime).replace("'", "").replace("\\", "");
                          web.evaluateJavascript("(function(){var x=new XMLHttpRequest();x.open('GET','" + url
                              + "',true);x.responseType='blob';x.onload=function(){var r=new FileReader();r.onloadend=function(){AndroidBridge.saveBase64(r.result,'"
                              + fn + "');};r.readAsDataURL(x.response);};x.send();})()", null);
                      } else {
                          try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception e) { }
                      }
                  });

                  int id = getResources().getIdentifier("capa", "drawable", getPackageName());
                  if (id != 0) {
                      splash = new ImageView(this);
                      splash.setBackgroundColor(Color.BLACK);
                      splash.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                      splash.setImageResource(id);
                      root.addView(splash, new FrameLayout.LayoutParams(-1, -1));
                  }
                  web.addJavascriptInterface(new AdsBridge(this, web, root), "Ads");
                  hideBars();
                  web.loadUrl("https://" + HOST + "/assets/index.html");
              }

              private void hideSplash() {
                  if (splash == null) return;
                  final ImageView sp = splash;
                  splash = null;
                  long wait = Math.max(0, 1200 - (System.currentTimeMillis() - startAt));
                  sp.postDelayed(() -> sp.animate().alpha(0f).setDuration(400).withEndAction(() -> root.removeView(sp)).start(), wait);
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              private void saveFile(byte[] data, String name, String mime) throws Exception {
                  if (name == null || name.trim().isEmpty()) name = "arquivo";
                  name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                  String where;
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (uri == null) throw new Exception("sem acesso a Downloads");
                      OutputStream o = getContentResolver().openOutputStream(uri);
                      o.write(data);
                      o.close();
                      where = "Downloads";
                  } else {
                      File f = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), name);
                      FileOutputStream o = new FileOutputStream(f);
                      o.write(data);
                      o.close();
                      where = f.getParent();
                  }
                  final String msg = "Salvo em " + where + ": " + name;
                  runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
              }

              private class Bridge {
                  @JavascriptInterface public void saveBase64(String dataUrl, String name) {
                      try {
                          int c = dataUrl.indexOf(',');
                          String meta = dataUrl.substring(0, c);
                          byte[] bytes = Base64.decode(dataUrl.substring(c + 1), Base64.DEFAULT);
                          String mime = "application/octet-stream";
                          if (meta.startsWith("data:")) {
                              int e = meta.indexOf(';');
                              String m = meta.substring(5, e > 0 ? e : meta.length());
                              if (!m.isEmpty()) mime = m;
                          }
                          saveFile(bytes, name, mime);
                      } catch (final Exception ex) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Erro ao salvar: " + ex.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  boolean ok = res.length > 0;
                  for (int r : res) if (r != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (code == REQ_PERM && pendingPerm != null) {
                      if (ok) pendingPerm.grant(pendingPerm.getResources()); else pendingPerm.deny();
                      pendingPerm = null;
                  } else if (code == REQ_JS && pendingJsPerm != null) {
                      callJs("window.onPermissao&&window.onPermissao('" + pendingJsPerm + "'," + ok + ")");
                      pendingJsPerm = null;
                  } else if (code == REQ_GEO && geoCb != null) {
                      geoCb.invoke(geoOrigin, ok, false);
                      geoCb = null;
                  }
              }

              @Override public void onBackPressed() {
                  web.evaluateJavascript("(function(){try{return !!(window.onBackButton&&window.onBackButton());}catch(e){return false;}})()", v -> {
                      if ("true".equals(v)) return;
                      long now = System.currentTimeMillis();
                      if (now - backAt < 2000) { finish(); }
                      else { backAt = now; Toast.makeText(MainActivity.this, "Toque novamente para sair", Toast.LENGTH_SHORT).show(); }
                  });
              }

              @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hideBars(); }
              @Override protected void onPause() { super.onPause(); if (!keepRunning) { web.onPause(); web.pauseTimers(); } }
              @Override protected void onResume() { super.onResume(); web.onResume(); web.resumeTimers(); }
              @Override protected void onDestroy() { if (current == this) current = null; super.onDestroy(); web.destroy(); }
          }
          EOT
          cat > app/src/main/java/com/taru/jogo/Nativo.java <<'EOT'
          package com.taru.jogo;

          import android.app.ActivityManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageInfo;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import java.util.Locale;
          import java.util.TimeZone;
          import org.json.JSONObject;

          public class Nativo {
              private final MainActivity a;
              Nativo(MainActivity a) { this.a = a; }

              @JavascriptInterface public String info() {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("modelo", Build.MODEL);
                      o.put("fabricante", Build.MANUFACTURER);
                      o.put("androidVersao", Build.VERSION.RELEASE);
                      o.put("sdk", Build.VERSION.SDK_INT);
                      o.put("idioma", Locale.getDefault().toLanguageTag());
                      o.put("fusoHorario", TimeZone.getDefault().getID());
                      DisplayMetrics dm = a.getResources().getDisplayMetrics();
                      o.put("telaLargura", dm.widthPixels);
                      o.put("telaAltura", dm.heightPixels);
                      o.put("densidade", dm.density);
                      Intent b = a.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (b != null) {
                          int l = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1), s = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                          int st = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                          o.put("bateria", s > 0 ? l * 100 / s : -1);
                          o.put("carregando", st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL);
                      }
                      ActivityManager am = (ActivityManager) a.getSystemService(Context.ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      am.getMemoryInfo(mi);
                      o.put("memoriaTotalMB", mi.totalMem / 1048576);
                      o.put("memoriaLivreMB", mi.availMem / 1048576);
                      o.put("rede", rede());
                      o.put("pacote", a.getPackageName());
                      try {
                          PackageInfo pi = a.getPackageManager().getPackageInfo(a.getPackageName(), 0);
                          o.put("versaoApp", pi.versionName);
                      } catch (Exception e) { }
                      o.put("acessibilidadeAtiva", AutoService.instance != null);
                      return o.toString();
                  } catch (Exception e) { return "{}"; }
              }

              private String rede() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) a.getSystemService(Context.CONNECTIVITY_SERVICE);
                      Network n = cm.getActiveNetwork();
                      if (n == null) return "nenhuma";
                      NetworkCapabilities c = cm.getNetworkCapabilities(n);
                      if (c == null) return "nenhuma";
                      if (c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) return "wifi";
                      if (c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) return "celular";
                      return "outra";
                  } catch (Exception e) { return "desconhecida"; }
              }

              @JavascriptInterface public void pedirPermissao(String nome) { a.askPermission(nome); }
              @JavascriptInterface public boolean temPermissao(String nome) { return a.hasPermission(nome == null ? "" : nome); }

              @JavascriptInterface public void toast(final String t) {
                  a.runOnUiThread(() -> Toast.makeText(a, t, Toast.LENGTH_SHORT).show());
              }
              @JavascriptInterface public void vibrar(final int ms) {
                  a.runOnUiThread(() -> {
                      try {
                          Vibrator v = (Vibrator) a.getSystemService(Context.VIBRATOR_SERVICE);
                          if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                          else v.vibrate(ms);
                      } catch (Exception e) { }
                  });
              }
              @JavascriptInterface public void copiar(final String t) {
                  a.runOnUiThread(() -> {
                      ClipboardManager cm = (ClipboardManager) a.getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("texto", t));
                  });
              }
              @JavascriptInterface public void compartilhar(final String t) {
                  a.runOnUiThread(() -> {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_TEXT, t);
                      a.startActivity(Intent.createChooser(i, "Compartilhar"));
                  });
              }
              @JavascriptInterface public void abrirLink(final String u) {
                  a.runOnUiThread(() -> { try { a.startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) { } });
              }
              @JavascriptInterface public void minimizar() { a.runOnUiThread(() -> a.moveTaskToBack(true)); }
              @JavascriptInterface public void sair() { a.runOnUiThread(() -> a.finish()); }
              @JavascriptInterface public void manterAtivo(boolean on) { a.keepRunning = on; }
              @JavascriptInterface public void manterTelaLigada(boolean on) { a.setKeepScreenOn(on); }

              /* ---- sobre outros apps e toques automaticos (precisa do servico de acessibilidade ligado) ---- */
              @JavascriptInterface public boolean acessibilidadeAtiva() { return AutoService.instance != null; }
              @JavascriptInterface public void abrirAcessibilidade() {
                  a.runOnUiThread(() -> {
                      Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      a.startActivity(i);
                  });
              }
              @JavascriptInterface public boolean tocar(float x, float y) {
                  AutoService s = AutoService.instance;
                  if (s == null) return false;
                  s.tap(x, y);
                  return true;
              }
              @JavascriptInterface public boolean deslizar(float x1, float y1, float x2, float y2, int ms) {
                  AutoService s = AutoService.instance;
                  if (s == null) return false;
