          REAL = '''package com.taru.jogo;
          import android.app.Activity;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import com.google.android.gms.ads.AdError;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.FullScreenContentCallback;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;
          import com.google.android.gms.ads.rewarded.RewardedAd;
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback;
          public class AdsBridge {
              private static final String BANNER = "__BAN__", INTER = "__INT__", REWARD = "__REW__";
              private final Activity act;
              private final WebView web;
              private final FrameLayout root;
              private AdView banner;
              private InterstitialAd inter;
              private RewardedAd reward;
              public AdsBridge(Activity a, WebView w, FrameLayout r) {
                  act = a; web = w; root = r;
                  MobileAds.initialize(a, status -> act.runOnUiThread(() -> { loadInter(); loadReward(); showBanner(); }));
              }
              private void js(final String c) { web.post(() -> web.evaluateJavascript(c, null)); }
              private void loadInter() {
                  if (INTER.isEmpty()) return;
                  InterstitialAd.load(act, INTER, new AdRequest.Builder().build(), new InterstitialAdLoadCallback() {
                      @Override public void onAdLoaded(InterstitialAd ad) { inter = ad; }
                      @Override public void onAdFailedToLoad(LoadAdError e) { inter = null; }
                  });
              }
              private void loadReward() {
                  if (REWARD.isEmpty()) return;
                  RewardedAd.load(act, REWARD, new AdRequest.Builder().build(), new RewardedAdLoadCallback() {
                      @Override public void onAdLoaded(RewardedAd ad) { reward = ad; }
                      @Override public void onAdFailedToLoad(LoadAdError e) { reward = null; }
                  });
              }
              @JavascriptInterface public void showBanner() {
                  act.runOnUiThread(() -> {
                      if (BANNER.isEmpty()) return;
                      if (banner == null) {
                          banner = new AdView(act);
                          banner.setAdUnitId(BANNER);
                          banner.setAdSize(AdSize.BANNER);
                          root.addView(banner, new FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL));
                          banner.loadAd(new AdRequest.Builder().build());
                      }
                      banner.setVisibility(View.VISIBLE);
                  });
              }
              @JavascriptInterface public void hideBanner() {
                  act.runOnUiThread(() -> { if (banner != null) banner.setVisibility(View.GONE); });
              }
              @JavascriptInterface public void showInterstitial() {
                  act.runOnUiThread(() -> {
                      if (inter == null) { loadInter(); js("window.onAdClosed&&window.onAdClosed('interstitial',false)"); return; }
                      inter.setFullScreenContentCallback(new FullScreenContentCallback() {
                          @Override public void onAdDismissedFullScreenContent() { inter = null; loadInter(); js("window.onAdClosed&&window.onAdClosed('interstitial',true)"); }
                          @Override public void onAdFailedToShowFullScreenContent(AdError e) { inter = null; loadInter(); js("window.onAdClosed&&window.onAdClosed('interstitial',false)"); }
                      });
                      inter.show(act);
                  });
              }
              @JavascriptInterface public void showRewarded() {
                  act.runOnUiThread(() -> {
                      if (reward == null) { loadReward(); js("window.onRewarded&&window.onRewarded(false)"); return; }
                      final boolean[] earned = { false };
                      reward.setFullScreenContentCallback(new FullScreenContentCallback() {
                          @Override public void onAdDismissedFullScreenContent() { reward = null; loadReward(); js("window.onRewarded&&window.onRewarded(" + earned[0] + ")"); }
                          @Override public void onAdFailedToShowFullScreenContent(AdError e) { reward = null; loadReward(); js("window.onRewarded&&window.onRewarded(false)"); }
                      });
                      reward.show(act, item -> earned[0] = true);
                  });
              }
          }
