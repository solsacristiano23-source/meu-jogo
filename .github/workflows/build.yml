          cat > app/src/main/java/com/taru/jogo/AutoService.java <<'EOT'
          package com.taru.jogo;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.TextView;

          /* Servico de acessibilidade com o minimo de poderes: so faz toques/deslizes e mostra um botao flutuante.
             Nao le a tela de outros apps (canRetrieveWindowContent = false). */
          public class AutoService extends AccessibilityService {
              static AutoService instance;
              private final Handler h = new Handler(Looper.getMainLooper());
              private Runnable loop;
              private View floatView;
              private WindowManager wm;

              @Override protected void onServiceConnected() { instance = this; super.onServiceConnected(); }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) { }
              @Override public void onInterrupt() { }
              @Override public boolean onUnbind(android.content.Intent i) { stopLoop(); hideFloat(); instance = null; return super.onUnbind(i); }
              @Override public void onDestroy() { instance = null; super.onDestroy(); }

              void tap(final float x, final float y) { h.post(() -> gesture(x, y, x, y, 40)); }
              void swipe(final float x1, final float y1, final float x2, final float y2, final int ms) { h.post(() -> gesture(x1, y1, x2, y2, Math.max(ms, 1))); }

              private void gesture(float x1, float y1, float x2, float y2, int ms) {
                  if (Build.VERSION.SDK_INT < 24) return;
                  Path p = new Path();
                  p.moveTo(x1, y1);
                  if (x1 != x2 || y1 != y2) p.lineTo(x2, y2);
                  GestureDescription.Builder b = new GestureDescription.Builder();
                  b.addStroke(new GestureDescription.StrokeDescription(p, 0, ms));
                  dispatchGesture(b.build(), null, null);
              }

              void startLoop(final float x, final float y, final int ms) {
                  stopLoop();
                  final int gap = Math.max(ms, 50);
                  loop = new Runnable() { @Override public void run() { gesture(x, y, x, y, 40); h.postDelayed(this, gap); } };
                  h.post(loop);
              }

              void stopLoop() {
                  h.post(() -> { if (loop != null) { h.removeCallbacks(loop); loop = null; } });
              }

              void showFloat(final String label) {
                  h.post(() -> {
                      if (floatView != null) { ((TextView) floatView).setText(label); return; }
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      final TextView t = new TextView(this);
                      t.setText(label);
                      t.setTextColor(Color.WHITE);
                      t.setTextSize(14);
                      t.setGravity(Gravity.CENTER);
                      t.setPadding(36, 24, 36, 24);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(0xDD7C5CFF);
                      gd.setCornerRadius(80);
                      t.setBackground(gd);
                      final WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.START;
                      lp.x = 40;
                      lp.y = 300;
                      t.setOnTouchListener(new View.OnTouchListener() {
                          float sx, sy; int ox, oy; boolean moved;
                          @Override public boolean onTouch(View v, MotionEvent e) {
                              switch (e.getAction()) {
                                  case MotionEvent.ACTION_DOWN: sx = e.getRawX(); sy = e.getRawY(); ox = lp.x; oy = lp.y; moved = false; return true;
                                  case MotionEvent.ACTION_MOVE:
                                      if (Math.abs(e.getRawX() - sx) + Math.abs(e.getRawY() - sy) > 12) moved = true;
                                      lp.x = ox + (int) (e.getRawX() - sx);
                                      lp.y = oy + (int) (e.getRawY() - sy);
                                      wm.updateViewLayout(v, lp);
                                      return true;
                                  case MotionEvent.ACTION_UP:
                                      if (!moved) MainActivity.callJs("window.onFlutuanteClick&&window.onFlutuanteClick()");
                                      return true;
                                  default: return false;
                              }
                          }
                      });
                      wm.addView(t, lp);
                      floatView = t;
                  });
              }

              void hideFloat() {
                  h.post(() -> {
                      if (floatView != null && wm != null) { try { wm.removeView(floatView); } catch (Exception e) { } }
                      floatView = null;
                  });
              }
          }
