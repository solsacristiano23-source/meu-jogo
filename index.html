<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stickman Vivo</title>
<style>
:root{color-scheme:dark;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1019;color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:19px}.sub{color:#aeb7cb;font-size:12px;margin-top:3px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px;color:#c6f5d4;white-space:nowrap}
#stage{position:relative;flex:1;min-height:220px;margin:0 10px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#26324c 0%,#151d2e 48%,#0b101b 100%)}canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:11px;color:#aeb8ce;pointer-events:none;text-shadow:0 1px 5px #000}
.controls{padding:12px 12px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{min-height:44px;border:1px solid var(--line);background:#20283a;color:#f4f6ff;border-radius:12px;font:600 13px system-ui;padding:9px 5px}button:active{transform:scale(.97);background:#35435e}button.primary{background:#d8e4ff;color:#101625;border-color:#d8e4ff}.bar{display:flex;gap:8px;padding:0 12px 10px}.bar button{flex:1;min-height:38px;font-size:12px}#status{min-height:16px;color:#aeb7cb;font-size:11px;text-align:center;padding:0 10px 7px}
@media(max-height:560px){header{padding:7px 12px 5px}h1{font-size:16px}.controls{padding:7px 10px;gap:5px}button{min-height:36px}.bar{padding-bottom:5px}}
</style>
</head>
<body>
<header><div><h1>Stickman Vivo</h1><div class="sub">Um boneco animado que reage aos seus toques</div></div><div class="pill" id="mood">Observando…</div></header>
<div id="stage"><canvas id="scene" aria-label="Stickman animado"></canvas><div class="hint">Toque no palco para chamar o stickman. Arraste para mudar o destino.</div></div>
<div class="controls">
<button class="primary" data-action="andar">Andar</button><button data-action="correr">Correr</button><button data-action="pular">Pular</button><button data-action="dancar">Dançar</button>
<button data-action="acenar">Acenar</button><button data-action="sentar">Sentar</button><button data-action="tropecar">Tropeçar</button><button data-action="parar">Parar</button>
</div>
<div class="bar"><button id="floatBtn">Testar janela flutuante</button><button id="hideBtn">Esconder flutuante</button></div>
<div id="status">Pronto • progresso salvo neste dispositivo</div>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),mood=document.getElementById('mood'),status=document.getElementById('status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('stickman-vivo-v1')||'{}')}catch{return {}}})();
const s={x:.5,targetX:.5,action:'idle',until:0,facing:1,speed:.22,hop:0,visits:Number(saved.visits||0)+1};
const labels={walk:'Vou dar uma volta!',run:'Modo turbo!',jump:'Uhuu!',dance:'Olha meu passinho!',wave:'Oi pra você!',sit:'Pausa merecida.',trip:'Ops!',idle:'Observando…'};
function persist(){try{localStorage.setItem('stickman-vivo-v1',JSON.stringify({visits:s.visits}))}catch{}}
persist();function say(t){status.textContent=t;mood.textContent=t.length>18?t.slice(0,17)+'…':t}
function size(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(size).observe(stage);size();
function choose(a){s.action=a;s.until=performance.now()+(a==='idle'?0:a==='sit'?4500:2400);if(a==='walk'||a==='run'){if(Math.abs(s.targetX-s.x)<.08)s.targetX=s.x<.5?.86:.14;s.speed=a==='run'?.72:.28}if(a==='jump')s.hop=1;say(labels[a]||'Pronto!')}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>choose(({andar:'walk',correr:'run',pular:'jump',dancar:'dance',acenar:'wave',sentar:'sit',tropecar:'trip',parar:'idle'})[b.dataset.action])));
let dragging=false;function point(e){const r=stage.getBoundingClientRect(),x=Math.max(.08,Math.min(.92,(e.clientX-r.left)/r.width));s.targetX=x;s.facing=x>=s.x?1:-1;choose('walk')}
stage.addEventListener('pointerdown',e=>{dragging=true;stage.setPointerCapture?.(e.pointerId);point(e)});stage.addEventListener('pointermove',e=>{if(dragging)point(e)});stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);
document.getElementById('floatBtn').onclick=()=>{if(window.Nativo&&typeof Nativo.mostrarFlutuante==='function'){const ok=Nativo.mostrarFlutuante('Stickman • toque para interagir');say(ok?'Janela flutuante ativa! Toque nela para o stickman acenar.':'Permita "Exibir sobre outros apps" para este app e volte ao jogo.')}else say('Abra pelo APK com a opção Flutuante + clique ligada.')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.Nativo&&typeof Nativo.sobreporPermitido==='function'&&Nativo.sobreporPermitido())say('Janela flutuante ativa! Toque nela para o stickman acenar.')});
document.getElementById('hideBtn').onclick=()=>{if(window.Nativo&&typeof Nativo.esconderFlutuante==='function'){Nativo.esconderFlutuante();say('Janela flutuante escondida.')}else say('A ponte nativa não está disponível.')};
window.onFlutuanteClick=()=>choose('wave');window.onBackButton=()=>{choose('idle');say('Toque em Parar para descansar.');return true};
function line(x1,y1,x2,y2,w=5){ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(t){
const r=stage.getBoundingClientRect(),w=r.width,h=r.height;ctx.clearRect(0,0,w,h);
for(let i=0;i<28;i++){const sx=i*83%Math.max(1,w),sy=i*47%Math.max(1,h*.72);ctx.fillStyle=`rgba(210,225,255,${.12+(i%4)*.04})`;ctx.beginPath();ctx.arc(sx,sy,i%5===0?1.5:.8,0,Math.PI*2);ctx.fill()}
const floor=h*.79,moving=s.action==='walk'||s.action==='run';
if(moving){const diff=s.targetX-s.x;if(Math.abs(diff)>.012){s.x+=Math.sign(diff)*Math.min(Math.abs(diff),s.speed*(reduced?.45:1)/60);s.facing=Math.sign(diff)}else if(s.until&&t>s.until){s.action='idle';say(labels.idle)}}
else if(s.until&&t>s.until&&!['sit','idle'].includes(s.action)){s.action='idle';s.hop=0;say(labels.idle)}
const phase=t*(s.action==='run'?.022:.009);let bob=moving?Math.abs(Math.sin(phase*2))*5:Math.sin(t*.003)*1.7,jump=0;
if(s.action==='jump')jump=Math.abs(Math.sin((t-(s.until-2400))*.004))*Math.min(48,h*.12);if(s.action==='trip')jump=Math.sin(t*.02)*5;if(s.action==='dance')bob=Math.abs(Math.sin(t*.009))*7;
const x=s.x*w,base=floor-jump+bob;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,floor+5,19-jump*.1,5,0,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#f4f7ff';const scale=Math.max(.72,Math.min(1.12,h/390));ctx.save();ctx.translate(x,base);ctx.scale(scale*s.facing,scale);
const sy=-49,hip=-27,armSwing=moving?Math.sin(phase)*.65:0,legSwing=moving?Math.sin(phase)*.68:0;
line(0,sy,0,hip,5);ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-83,12,0,Math.PI*2);ctx.stroke();
ctx.fillStyle='#f4f7ff';ctx.beginPath();ctx.arc(-4,-85,1.5,0,Math.PI*2);ctx.arc(4,-85,1.5,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,-81,4,.25,Math.PI-.25);ctx.stroke();
let ax1=-19+armSwing*10,ay1=-39+Math.abs(armSwing)*7,ax2=19-armSwing*10,ay2=ay1;
if(s.action==='wave'){ax2=24+Math.sin(t*.012)*3;ay2=-76+Math.sin(t*.015)*4}
if(s.action==='dance'){ax1=-24;ay1=-65+Math.sin(t*.01)*8;ax2=24;ay2=-65-Math.sin(t*.01)*8}
if(s.action==='sit'){ax1=-20;ay1=-27;ax2=20;ay2=-27}
line(0,sy,ax1,ay1,4.5);line(0,sy,ax2,ay2,4.5);
if(s.action==='sit'){line(0,hip,-15,-16,5);line(-15,-16,-28,-16,5);line(0,hip,15,-16,5);line(15,-16,28,-16,5)}
else{line(0,hip,-12+Math.sin(phase)*legSwing*12,-7-Math.max(0,legSwing)*5,5);line(-12+Math.sin(phase)*legSwing*12,-7-Math.max(0,legSwing)*5,-16+Math.sin(phase)*legSwing*16,0,5);line(0,hip,12-Math.sin(phase)*legSwing*12,-7-Math.max(0,-legSwing)*5,5);line(12-Math.sin(phase)*legSwing*12,-7-Math.max(0,-legSwing)*5,16-Math.sin(phase)*legSwing*16,0,5)}
if(s.action==='jump'||s.action==='dance'){ctx.strokeStyle='rgba(141,190,255,.7)';line(-28,-75,-35,-83,2);line(28,-75,35,-83,2)}
ctx.restore();ctx.strokeStyle='rgba(190,210,255,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,floor+9);ctx.lineTo(w,floor+9);ctx.stroke();requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
