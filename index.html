<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelion: Esquecimento</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dcd8e3;--ink:#2a2733;--gold:#b8801a;--fog:#9a95a8;--card:#eceaf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b24;--ink:#e8e4ef;--gold:#e8b44a;--fog:#4a4658;--card:#2a2733}}
:root[data-theme="dark"]{--bg:#1d1b24;--ink:#e8e4ef;--gold:#e8b44a;--fog:#4a4658;--card:#2a2733}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Spectral,Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:420px}
#stage{position:relative}
canvas{display:block;width:100%;height:auto;touch-action:none;background:#2e2a39}
#ov{position:absolute;inset:0;background:rgba(30,27,38,.9);color:#f1eef6;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
#ov[hidden]{display:none}
#ov h1{font-size:28px;margin:0 0 12px}#ov p{max-width:30ch;line-height:1.5;margin:0 0 20px}
button{font:inherit;border-radius:6px;border:1px solid var(--gold);min-height:40px;cursor:pointer;background:var(--gold);color:#1d1b24;font-weight:700}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#ov button{padding:0 28px;min-height:48px}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#ctl{display:flex;gap:8px;padding:8px;height:200px;box-sizing:border-box}
#pad{flex:1;position:relative;touch-action:none;border:2px dashed var(--fog);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;text-align:center;padding:8px}
#base{display:none;position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(150,145,170,.3);border:2px solid var(--fog);pointer-events:none}
#knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:var(--gold)}
#cards{flex:1.4;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{display:flex;flex-direction:column;gap:6px}
.card button{touch-action:manipulation}
.card .u{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;border-radius:14px}
.card i{display:block;width:70%;height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
.card u{display:block;height:100%;background:#1d1b24;text-decoration:none}
.card .b{min-height:46px;background:transparent;color:var(--ink);border-color:var(--fog)}
.card .u.cd{opacity:.5}
.card.x{opacity:.4}
</style></head><body><main>
<div id="stage"><canvas id="c"></canvas><div id="ov"></div></div>
<div id="ctl"><div id="pad">Arraste aqui para andar<div id="base"><div id="knob"></div></div></div><div id="cards"></div></div>
</main>
<script>
const $=s=>document.querySelector(s),C=$('#c'),X=C.getContext('2d'),W=360,H=480,cx=W/2,cy=H/2,T=6.283;
C.width=W;C.height=H;
const DEF=[['Golpe',.35],['Investida',2],['Chama',3]],K={},cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let S,P=null,run=false,last=0;
function init(){
 S={p:{x:cx,y:cy+80,hp:100,fx:0,fy:-1,inv:0},m:DEF.map(([n,cd])=>({n,cd,st:100,c:0,on:true})),
 en:[],pr:[],fx:[],boss:null,R:330,kills:0,sp:0,fury:0,burned:0,t:0};
 $('#cards').innerHTML=S.m.map((m,i)=>`<div class="card" id="k${i}"><button class="u" data-u="${i}"><b>${m.n}</b><i><u></u></i></button><button class="b" data-b="${i}">Queimar</button></div>`).join('');
}
function ov(h,p,b){const o=$('#ov');o.innerHTML=`<h1>${h}</h1><p>${p}</p><button id="go">${b}</button>`;o.hidden=false;$('#go').onclick=()=>{init();o.hidden=true;run=true}}
function hurt(e,d){e.hp-=d;e.fl=.1}
function near(x,y,r,d){S.en.forEach(e=>{if(Math.hypot(e.x-x,e.y-y)<r+e.r)hurt(e,d)});const b=S.boss;if(b&&Math.hypot(b.x-x,b.y-y)<r+b.r)hurt(b,d)}
function ring(x,y,m,col){S.fx.push({x,y,m,col,a:1,r:0})}
function use(i){const m=S.m[i],p=S.p;if(!run||!m.on||m.c>0)return;
 const f=S.fury>0,pw=(.4+.6*m.st/100)*(f?2.5:1);m.c=m.cd*(f?.5:1);
 if(i==0){near(p.x,p.y,58,14*pw);ring(p.x,p.y,58,'#e8b44a')}
 if(i==1){const sx=p.x,sy=p.y;p.x=cl(p.x+p.fx*120,10,W-10);p.y=cl(p.y+p.fy*120,10,H-10);
  for(let k=0;k<=4;k++)near(sx+(p.x-sx)*k/4,sy+(p.y-sy)*k/4,16,12*pw);p.inv=.4;ring(p.x,p.y,30,'#fff')}
 if(i==2){const t=[...S.en,S.boss].filter(Boolean).reduce((a,e)=>!a||Math.hypot(e.x-p.x,e.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?e:a,null);
  const dx=t?t.x-p.x:p.fx,dy=t?t.y-p.y:p.fy,l=Math.hypot(dx,dy)||1;
  S.pr.push({x:p.x,y:p.y,vx:dx/l*240,vy:dy/l*240,pl:1,d:32*pw,l:2})}}
function burn(i){const m=S.m[i];if(!run||!m.on)return;m.on=false;S.burned++;S.fury=5;near(cx,cy,999,60);ring(S.p.x,S.p.y,300,'#ff7a3a')}
function end(r){if(!run)return;run=false;const b=S.burned;
 const t=r==1?['Engolido pela Névoa','Você esqueceu quem era antes de cair. Tente de novo.']:
 b>=2?['Final do Sacrifício','O Coração acende. O mundo renasce, mas ninguém lembra de você.']:
 b==1?['Final da Ruptura','Você estilhaça o Coração. Os deuses se vão e o mundo escolhe seu próprio rumo.']:
 ['Final do Domínio','Você resistiu ao esquecimento e tomou o poder de Vhaldrek. O mundo ganhou um novo deus sombrio.'];
 ov(t[0],t[1],'Jogar de novo')}
function upd(dt){const s=S,p=s.p;s.t+=dt;
 let dx=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0),dy=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0);
 if(J){dx=J.x;dy=J.y}
 const l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;p.fx=dx;p.fy=dy;p.x=cl(p.x+dx*130*dt,8,W-8);p.y=cl(p.y+dy*130*dt,8,H-8)}
 p.inv-=dt;s.fury=Math.max(0,s.fury-dt);s.R=Math.max(110,s.R-6*dt);
 const out=Math.hypot(p.x-cx,p.y-cy)>s.R;
 s.m.forEach(m=>{m.c=Math.max(0,m.c-dt);if(m.on){m.st-=(1.2+(out?12:0))*dt;if(m.st<=0){m.st=0;m.on=false}}});
 s.sp-=dt;if(s.sp<=0&&s.en.length<12){const a=Math.random()*T;s.en.push({x:cx+Math.cos(a)*250,y:cy+Math.sin(a)*250,hp:20,r:9,sp:45+Math.random()*30,fl:0});s.sp=1.1}
 s.en.forEach(e=>{const vx=p.x-e.x,vy=p.y-e.y,l=Math.hypot(vx,vy)||1;e.x+=vx/l*e.sp*dt;e.y+=vy/l*e.sp*dt;e.fl-=dt;if(l<e.r+8&&p.inv<=0){p.hp-=7;p.inv=.6}});
 if(!s.boss&&!s.bd&&s.kills>=12){s.boss={x:cx,y:50,hp:300,max:300,r:26,t:1.5,fl:0};s.bd=1}
 const b=s.boss;
 if(s.m[0].on&&s.m[0].c<=0&&[...s.en,b].filter(Boolean).some(e=>Math.hypot(e.x-p.x,e.y-p.y)<58+e.r))use(0);
 if(b){const vx=p.x-b.x,vy=p.y-b.y,l=Math.hypot(vx,vy)||1;b.x+=vx/l*22*dt;b.y+=vy/l*22*dt;b.fl-=dt;b.t-=dt;
  if(b.t<=0){b.t=1.8;const o=Math.random()*6;for(let k=0;k<10;k++){const a=o+k*.628;s.pr.push({x:b.x,y:b.y,vx:Math.cos(a)*100,vy:Math.sin(a)*100,pl:0,d:6,l:4})}}
  if(l<b.r+8&&p.inv<=0){p.hp-=14;p.inv=.8}
  if(b.hp<=0){s.boss=null;end(2);return}}
 s.pr=s.pr.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;
  if(q.pl){const t=[...s.en,b].filter(Boolean).find(e=>Math.hypot(e.x-q.x,e.y-q.y)<e.r+5);if(t){near(q.x,q.y,45,q.d);ring(q.x,q.y,45,'#ff7a3a');return false}}
  else if(Math.hypot(p.x-q.x,p.y-q.y)<10&&p.inv<=0){p.hp-=q.d;p.inv=.3;return false}
  return q.l>0});
 const dead=s.en.filter(e=>e.hp<=0).length;
 if(dead){s.kills+=dead;s.R=Math.min(340,s.R+12*dead);s.m.forEach(m=>{if(m.on)m.st=Math.min(100,m.st+5*dead)});s.en=s.en.filter(e=>e.hp>0)}
 s.fx=s.fx.filter(f=>{f.a-=dt*2.5;f.r=f.m*(1-f.a);return f.a>0});
 if(p.hp<=0)end(1)}
function circ(x,y,r,c){X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,T);X.fill()}
function draw(){const s=S,p=s.p,b=s.boss;
 X.fillStyle='#2e2a39';X.fillRect(0,0,W,H);
 X.beginPath();X.rect(0,0,W,H);X.arc(cx,cy,s.R,0,T,true);X.fillStyle='rgba(190,185,205,.93)';X.fill('evenodd');
 X.beginPath();X.arc(cx,cy,s.R,0,T);X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=2;X.stroke();
 s.en.forEach(e=>circ(e.x,e.y,e.r,e.fl>0?'#fff':'#7a7094'));
 if(b){circ(b.x,b.y,b.r,b.fl>0?'#fff':'#d9622b');X.fillStyle='#0008';X.fillRect(40,8,W-80,8);X.fillStyle='#d9622b';X.fillRect(40,8,(W-80)*Math.max(0,b.hp)/b.max,8)}
 s.pr.forEach(q=>circ(q.x,q.y,q.pl?5:4,q.pl?'#ff9a4a':'#d9622b'));
 s.fx.forEach(f=>{X.strokeStyle=f.col;X.globalAlpha=f.a;X.lineWidth=3;X.beginPath();X.arc(f.x,f.y,f.r,0,T);X.stroke()});X.globalAlpha=1;
 if(p.inv<=0||(s.t*20|0)%2){if(s.fury>0)circ(p.x,p.y,15,'rgba(255,122,58,.5)');circ(p.x,p.y,8,'#e8b44a');circ(p.x,p.y,3,'#fff')}
 X.fillStyle='#0008';X.fillRect(10,H-14,100,7);X.fillStyle='#c0504d';X.fillRect(10,H-14,Math.max(0,p.hp),7);
 X.fillStyle='#1d1b24';X.font='13px Georgia';X.fillText(b?'Guardião Pálido':'Ecos: '+Math.min(s.kills,12)+'/12',W-120,H-7);
 if(s.fury>0){X.fillStyle='#ff7a3a';X.fillText('Fúria '+s.fury.toFixed(1)+'s',10,H-24)}}
function hud(){S.m.forEach((m,i)=>{const k=$('#k'+i);k.classList.toggle('x',!m.on);k.querySelector('u').style.width=m.st+'%';
 k.querySelector('b').textContent=m.on?DEF[i][0]:'???';k.querySelector('.u').classList.toggle('cd',m.c>0);k.querySelectorAll('button').forEach(x=>x.disabled=!m.on)})}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(run)upd(dt);draw();hud();requestAnimationFrame(loop)}
let J=null,jid=null,jo=null;const pad=$('#pad'),base=$('#base'),knob=$('#knob');
pad.addEventListener('pointerdown',e=>{jid=e.pointerId;pad.setPointerCapture(jid);const r=pad.getBoundingClientRect();jo={x:e.clientX,y:e.clientY};base.style.display='block';base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px';knob.style.transform='none'});
pad.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;const dx=e.clientX-jo.x,dy=e.clientY-jo.y,l=Math.hypot(dx,dy),m=Math.min(l,45);J=l>10?{x:dx/l,y:dy/l}:null;knob.style.transform=l?`translate(${dx/l*m}px,${dy/l*m}px)`:'none'});
const rel=e=>{if(e.pointerId!==jid)return;jid=null;J=null;base.style.display='none'};
pad.addEventListener('pointerup',rel);pad.addEventListener('pointercancel',rel);
addEventListener('contextmenu',e=>e.preventDefault());
const kn=e=>e.key.length>1?e.key.toLowerCase():e.key.toLowerCase();
addEventListener('keydown',e=>{K[kn(e)]=1;const m=/^Digit([123])$/.exec(e.code);if(m)(e.shiftKey?burn:use)(m[1]-1)});
addEventListener('keyup',e=>K[kn(e)]=0);
$('#cards').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;e.preventDefault();b.dataset.u!=null?use(+b.dataset.u):burn(+b.dataset.b)});
init();
ov('Aurelion: Esquecimento','A Névoa apaga suas Memórias. Fique dentro da luz, derrote os Ecos e o Guardião Pálido. Queimar uma Memória dá uma Fúria poderosa, mas ela some para sempre. Arraste no quadro de baixo para andar. O Golpe é automático. No teclado: WASD, 1-3 e Shift+1-3.','Começar');
requestAnimationFrame(loop);
</script></body></html>
